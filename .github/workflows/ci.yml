name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Generated parser is up to date
        run: |
          npx --yes tree-sitter-cli@0.25.10 generate
          git diff --exit-code src/
      - name: Corpus tests
        run: npx --yes tree-sitter-cli@0.25.10 test
      - name: Examples parse without errors
        run: npx --yes tree-sitter-cli@0.25.10 parse --quiet examples/*
